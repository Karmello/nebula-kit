<!doctype html>
<html data-theme="light">
  <head>
    <base href="/" />
    <title>NebulaKit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
    <meta name="google" content="notranslate" />
    <meta name="application-name" content="Nebula Kit" />
    <meta name="author" content="Kamil Noga" />
    <meta
      name="description"
      content="React UI system built on composition - small, consistent parts combining into larger structures with clarity and control. Each component follows the same foundation, producing apps that stay predictable, stable and effortless to scale."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <script type="module">
      if (import.meta.env.PROD) {
        const domain = import.meta.env.VITE_PLAUSIBLE_DOMAIN
        if (domain) {
          const s = document.createElement('script')
          s.async = true
          s.src = 'https://plausible.io/js/plausible.js'
          s.dataset.domain = domain
          document.head.appendChild(s)
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/client/index.tsx"></script>
  </body>
</html>
